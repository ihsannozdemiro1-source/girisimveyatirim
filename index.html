<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girişim ve Yatırım - Ekosistem Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #08090b; color: #f4f1ea; }
    .al-accent-bg { background-color: #10b981; color: #08090b; }
    .al-card-dark { background-color: #12141a; border: 1px solid #1e222d; }
  </style>
  <script>
    if (localStorage.getItem('user_logged_in') === 'true') {
      document.write('<style>#landingView { display: none !important; } #appView { display: block !important; }</style>');
    }
  </script>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="border-b border-[#1e222d] bg-[#08090b]/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <button type="button" onclick="handleLogoClick()" class="text-2xl font-black text-white">Girişim ve Yatırım</button>
      <nav id="appNav" style="display: none;" class="flex items-center space-x-2">
        <button onclick="showTab('startups')" class="tab-btn px-4 py-2 rounded-full text-xs font-bold bg-[#1e222d] text-white">🚀 Girişimler</button>
        <button onclick="showTab('admin')" id="btn-admin" style="display: none;" class="tab-btn px-4 py-2 rounded-full text-xs font-bold text-amber-400 border border-amber-500/30">⚡ Yönetici</button>
      </nav>
      <button type="button" id="loginHeaderBtn" onclick="openAuthModal('login')" class="text-xs font-bold text-white px-4 py-2 border border-[#1e222d] rounded-full">Giriş Yap</button>
    </div>
  </header>

  <!-- UYGULAMA ALANI -->
  <main id="appView" class="max-w-7xl mx-auto px-6 py-10" style="display: none;">
    <div id="tab-admin" class="content-tab space-y-8" style="display: none;">
      <div class="al-card-dark p-8 rounded-3xl border border-amber-500/30">
        <h2 class="text-2xl font-black text-white">İstatistikler</h2>
        <div class="grid grid-cols-2 gap-4 mt-6">
          <div class="al-card-dark p-6 rounded-2xl">
            <div class="text-slate-400 text-xs">Toplam Kayıtlı Kullanıcı</div>
            <div class="text-3xl font-black text-emerald-400" id="adminUserCount">1</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const ADMIN_EMAIL = 'ihsannozdemiro1@gmail.com';
    var currentUser = null;

    // Kullanıcıyı her zaman "platform_users" dizisine ekler ve günceller
    function trackUser(email) {
      if (!email) return;
      var users = JSON.parse(localStorage.getItem('platform_users') || '[]');
      if (!users.includes(email)) {
        users.push(email);
        localStorage.setItem('platform_users', JSON.stringify(users));
      }
    }

    function updateUserUI(user) {
      currentUser = user;
      if (user) {
        trackUser(user.email); // Kayıt/Giriş yapıldığında listeye ekle
        document.getElementById('appNav').style.display = 'flex';
        document.getElementById('loginHeaderBtn').style.display = 'none';
        document.getElementById('landingView').style.display = 'none';
        document.getElementById('appView').style.display = 'block';
        
        // Admin mi kontrol et
        if (user.email === ADMIN_EMAIL) {
          document.getElementById('btn-admin').style.display = 'block';
        }
      }
    }

    function renderAdminDashboard() {
      // Her zaman güncel listeyi çek ve say
      var users = JSON.parse(localStorage.getItem('platform_users') || '[]');
      document.getElementById('adminUserCount').innerText = Math.max(1, users.length);
    }

    // Auth sonrası tetiklenecek fonksiyon
    async function handleAuthSubmit() {
        // ... giriş/kayıt işlemleri ...
        // İşlem başarılı olduktan sonra:
        // trackUser(email); 
        // renderAdminDashboard();
    }
  </script>
</body>
</html>
