<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girişim ve Yatırım - Ekosistem Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Clerk SDK -->
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_c3Ryb25nlk5wYXJyb3ctNDMuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #08090b; color: #f4f1ea; }
    .al-accent-bg { background-color: #10b981; color: #08090b; }
    .al-card-dark { background-color: #12141a; border: 1px solid #1e222d; }
    .hero-glow { background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.15) 0%, rgba(8, 9, 11, 0) 70%); }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>

  <script>
    // Sayfa yenileme/yükleme sorunu için güvenli kontrol
    window.addEventListener('load', async () => {
      if (window.Clerk) await Clerk.load();
    });
  </script>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="border-b border-[#1e222d] bg-[#08090b]/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <button type="button" onclick="window.location.reload()" class="text-2xl font-black text-white flex items-center gap-3">
        <span>Girişim ve Yatırım</span>
      </button>

      <div class="flex items-center space-x-3">
        <button type="button" onclick="Clerk.openSignIn()" class="text-xs font-bold text-slate-300 hover:text-white px-3 py-2">Giriş Yap</button>
        <button type="button" onclick="handleNewAddClick()" class="bg-white text-[#08090b] font-extrabold text-xs px-5 py-2.5 rounded-full">+ İlan Ekle</button>
      </div>
    </div>
  </header>

  <!-- İLAN EKLEME MODALI (AI Model Doktoru ile) -->
  <div id="addModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
    <div class="al-card-dark rounded-3xl max-w-md w-full p-6 relative text-white">
      <h2 class="text-xl font-black mb-4">Yeni İlan</h2>
      <textarea id="addDesc" rows="3" placeholder="Projenizi anlatın..." class="w-full p-2.5 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs mb-3"></textarea>
      
      <!-- AI MODEL DOKTORU BUTONU -->
      <button type="button" onclick="runAiModelDoctor()" class="text-[10px] text-emerald-400 font-bold mb-4 hover:underline">✨ AI ile İlanı Optimize Et</button>
      
      <button type="button" onclick="closeCreateModal()" class="w-full al-accent-bg font-black py-3 rounded-xl text-xs">Yayınla</button>
    </div>
  </div>

  <!-- DETAY MODALI (AI Due Diligence ile) -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
    <div class="al-card-dark rounded-3xl max-w-2xl w-full p-8 text-white relative">
      <button type="button" onclick="closeDetailModal()" class="absolute top-5 right-5 text-xl font-bold">&times;</button>
      <h2 id="detailTitle" class="text-3xl font-black mb-4"></h2>
      
      <!-- AI DUE DILIGENCE BUTONU -->
      <div class="bg-[#08090b] p-4 rounded-xl border border-emerald-500/30 mb-4">
        <button type="button" onclick="runAiDueDiligence()" class="text-emerald-400 font-bold text-xs">🤖 AI Risk & Sağlamlık Raporu Al</button>
        <div id="aiAuditResult" class="hidden text-xs text-slate-300 mt-2"></div>
      </div>
      
      <p id="detailDesc" class="text-slate-300 text-xs mb-6"></p>
    </div>
  </div>

  <script>
    // 1. AI Due Diligence (Risk Analizi)
    function runAiDueDiligence() {
      const resBox = document.getElementById('aiAuditResult');
      resBox.classList.remove('hidden');
      resBox.innerHTML = 'Analiz ediliyor...';
      setTimeout(() => {
        resBox.innerHTML = '✅ AI Analizi: Bu proje pazar verilerine göre "Yatırım Yapılabilir" kategorisinde. Risk: Orta. Büyüme hızı yüksek.';
      }, 1000);
    }

    // 2. AI Model Doktoru (İlan Optimizasyonu)
    function runAiModelDoctor() {
      const desc = document.getElementById('addDesc');
      showToast("Başarılı", "AI metnini yatırımcı diline optimize etti!");
      desc.value += "\n\n(AI Optimizasyonu): Ölçeklenebilir B2B modeliyle yüksek potansiyel barındırıyor.";
    }

    function showToast(t, d) { alert(t + ": " + d); }
    function openStartupFormModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('addModal').classList.add('hidden'); }
    function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }
    function handleNewAddClick() { openStartupFormModal(); }
    function openDetailModal(item) { 
        document.getElementById('detailTitle').innerText = "Örnek Proje";
        document.getElementById('detailDesc').innerText = "Bu bir örnek açıklamadır.";
        document.getElementById('detailModal').classList.remove('hidden'); 
    }
  </script>
</body>
</html>
