<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girişim ve Yatırım - Profesyonel Ekosistem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #08090b; color: #f4f1ea; }
    .al-card-dark { background-color: #12141a; border: 1px solid #1e222d; }
    .emerald-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.1); }
  </style>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="border-b border-[#1e222d] bg-[#08090b]/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <span class="text-xl font-black text-white">Girişim & Yatırım</span>
      <div id="appNav" class="flex items-center space-x-4">
        <button onclick="showTab('startups')" class="text-xs font-bold text-emerald-400">🚀 Girişimler</button>
        <button onclick="handleNewAddClick()" class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold">+ İlan Ver</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-10">
    <div id="tab-startups" class="space-y-8">
      <!-- Filtre Paneli -->
      <section class="al-card-dark p-6 rounded-3xl grid grid-cols-1 md:grid-cols-4 gap-4">
        <input type="text" id="searchInput" onkeyup="filterStartups()" placeholder="İsim ara..." class="p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs text-white">
        <select id="sectorFilter" onchange="filterStartups()" class="p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs text-white">
          <option value="">Tüm Sektörler</option>
          <option value="Yapay Zekâ">Yapay Zekâ</option>
          <option value="Fintek">Fintek</option>
          <option value="SaaS">SaaS</option>
        </select>
        <select id="stageFilter" onchange="filterStartups()" class="p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs text-white">
          <option value="">Tüm Aşamalar</option>
          <option value="Fikir">Fikir</option>
          <option value="MVP">MVP</option>
          <option value="Growth">Growth</option>
        </select>
        <select id="budgetFilter" onchange="filterStartups()" class="p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs text-white">
          <option value="">Bütçe Filtresi</option>
          <option value="50000">&le; $50k</option>
          <option value="250000">&le; $250k</option>
        </select>
      </section>

      <section id="startupGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></section>
    </div>
  </main>

  <!-- İLAN EKLEME FORMU (Gelişmiş) -->
  <div id="addModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
    <div class="al-card-dark rounded-3xl max-w-lg w-full p-8 text-white space-y-4">
      <h2 class="text-2xl font-black">Profesyonel İlan Ver</h2>
      <input type="text" id="addTitle" placeholder="Proje Adı" class="w-full p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs">
      <div class="grid grid-cols-2 gap-4">
        <input type="number" id="addMRR" placeholder="Aylık Gelir (MRR $)" class="w-full p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs">
        <input type="number" id="addGoal" placeholder="Hedef Yatırım ($)" class="w-full p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs">
      </div>
      <input type="url" id="addPitchDeck" placeholder="Pitch Deck / Veri Odası URL" class="w-full p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs">
      <textarea id="addDesc" placeholder="Girişim Detayları ve Büyüme Metrikleri..." rows="3" class="w-full p-3 bg-[#08090b] border border-[#1e222d] rounded-xl text-xs"></textarea>
      <button onclick="handleAddStartup()" class="w-full al-accent-bg font-black py-3 rounded-xl text-xs">Yayınla</button>
    </div>
  </div>

  <script>
    var startups = JSON.parse(localStorage.getItem('my_startups_list') || '[]');

    function renderStartups(data) {
      var grid = document.getElementById('startupGrid');
      grid.innerHTML = '';
      data.forEach(function(item) {
        var card = document.createElement('div');
        card.className = "al-card-dark rounded-3xl p-6 space-y-4";
        card.innerHTML = `
          <div>
            <h3 class="text-xl font-black text-white">${item.name}</h3>
            <p class="text-emerald-400 text-xs font-bold mt-1">MRR: $${item.mrr || 0} • Hedef: $${item.goal}</p>
          </div>
          <p class="text-slate-400 text-xs">${item.description}</p>
          <a href="${item.pitch_deck}" target="_blank" class="block text-center text-xs font-bold py-2 border border-[#1e222d] rounded-xl hover:bg-[#1e222d]">📊 Veri Odasına Git</a>
        `;
        grid.appendChild(card);
      });
    }

    function handleAddStartup() {
      var newStartup = {
        id: Date.now(),
        name: document.getElementById('addTitle').value,
        mrr: document.getElementById('addMRR').value,
        goal: document.getElementById('addGoal').value,
        pitch_deck: document.getElementById('addPitchDeck').value,
        description: document.getElementById('addDesc').value
      };
      startups.unshift(newStartup);
      localStorage.setItem('my_startups_list', JSON.stringify(startups));
      renderStartups(startups);
      document.getElementById('addModal').classList.add('hidden');
    }

    function filterStartups() { /* Filtreleme mantığı aynı */ }
    function openStartupFormModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('addModal').classList.add('hidden'); }
    function handleNewAddClick() { openStartupFormModal(); }
    
    renderStartups(startups);
  </script>
</body>
</html>
