<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girişim ve Yatırım - Ekosistem Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #08090b; color: #f4f1ea; }
    .al-accent-bg { background-color: #10b981; color: #08090b; }
    .al-card-dark { background-color: #12141a; border: 1px solid #1e222d; }
    .hero-glow { background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.15) 0%, rgba(8, 9, 11, 0) 70%); }
    .hidden { display: none !important; }
  </style>
  <script>
    // Sayfa render edilmeden önce kontrol et
    (function() {
      if (localStorage.getItem('user_logged_in') === 'true') {
        // AppView'i hemen göster, landing'i gizle
        document.documentElement.style.display = 'block';
      }
    })();
  </script>
</head>
<body class="antialiased selection:bg-[#10b981] selection:text-black">

  <!-- Header -->
  <header class="border-b border-[#1e222d] bg-[#08090b]/90 backdrop-blur-md sticky top-0 z-40">
    <!-- Header içeriğin aynı kalıyor -->
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <button type="button" onclick="handleLogoClick()" class="text-2xl font-black text-white flex items-center gap-3">Merkür</button>
      <nav id="appNav" style="display: none;" class="items-center space-x-1.5 bg-[#12141a] p-1.5 rounded-full border border-[#1e222d]">
         <!-- Nav butonların burada -->
      </nav>
      <button type="button" id="loginHeaderBtn" onclick="openAuthModal('login')" class="text-xs font-bold text-slate-300">Giriş Yap</button>
    </div>
  </header>

  <!-- Landing View: Başlangıçta sınıfı 'hidden' olarak ayarlandı -->
  <div id="landingView" class="hidden">
    <!-- Hero Bölümü -->
  </div>

  <!-- App View: Başlangıçta gizli, sadece JS tetiklerse açılır -->
  <main id="appView" class="hidden max-w-7xl mx-auto px-6 py-10">
    <!-- Uygulama içeriği -->
  </main>

  <script>
    // Sayfa yüklendiğinde oturum durumuna göre view'i güncelle
    window.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = localStorage.getItem('user_logged_in') === 'true';
      const landing = document.getElementById('landingView');
      const app = document.getElementById('appView');
      
      if (isLoggedIn) {
        landing.classList.add('hidden');
        app.classList.remove('hidden');
      } else {
        landing.classList.remove('hidden');
        app.classList.add('hidden');
      }
    });

    // ... Geri kalan fonksiyonların (showTab, loadStartups vb.) aynı kalıyor
  </script>
</body>
</html>
