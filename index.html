<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girişim ve Yatırım - Ekosistem Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Clerk SDK -->
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_c3Ryb25nlk5wYXJyb3ctNDMuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #08090b; color: #f4f1ea; }
    .al-accent-bg { background-color: #10b981; color: #08090b; }
    .al-card-dark { background-color: #12141a; border: 1px solid #1e222d; }
    .hero-glow { background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.15) 0%, rgba(8, 9, 11, 0) 70%); }
    html.logged-in #landingView { display: none !important; }
    html.logged-in #appView { display: block !important; }
    html.not-logged-in #landingView { display: block !important; }
    html.not-logged-in #appView { display: none !important; }
  </style>

  <script>
    // Başlangıçta görünümü belirle
    if (localStorage.getItem('user_logged_in') === 'true') {
      document.documentElement.className = 'logged-in scroll-smooth';
    } else {
      document.documentElement.className = 'not-logged-in scroll-smooth';
    }
  </script>
</head>
<body class="antialiased">

  <header class="border-b border-[#1e222d] bg-[#08090b]/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="text-2xl font-black text-white">Girişim ve Yatırım</div>
      
      <div class="flex items-center space-x-3">
        <div id="userProfileBox" class="hidden flex items-center space-x-3">
          <span id="userEmailLabel" class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/30"></span>
          <button type="button" onclick="Clerk.signOut(); window.location.reload();" class="text-xs font-semibold text-slate-400 hover:text-rose-400 transition cursor-pointer">Çıkış Yap</button>
        </div>
        <!-- BUTONLARI BURADA DÜZELTTİM -->
        <button type="button" id="loginBtn" onclick="Clerk.openSignIn()" class="text-xs font-bold text-slate-300 hover:text-white px-3 py-2 transition cursor-pointer">Giriş Yap</button>
        <button type="button" onclick="Clerk.openSignUp()" class="bg-white text-[#08090b] font-extrabold text-xs px-5 py-2.5 rounded-full shadow-md transition cursor-pointer">Kayıt Ol</button>
      </div>
    </div>
  </header>

  <div id="landingView">
    <div class="py-24 text-center">
      <h1 class="text-6xl font-black text-white">Geleceği Yatırımla Buluşturun.</h1>
      <button onclick="Clerk.openSignUp()" class="mt-8 al-accent-bg font-black text-xs px-8 py-4 rounded-xl cursor-pointer">Hemen Başla</button>
    </div>
  </div>

  <main id="appView" class="max-w-7xl mx-auto px-6 py-10">
    <h2 class="text-white text-2xl font-bold">Hoş geldin! Portala giriş yaptın.</h2>
  </main>

  <script>
    window.addEventListener('load', async function () {
      await Clerk.load();
      if (Clerk.user) {
        document.documentElement.className = 'logged-in scroll-smooth';
        localStorage.setItem('user_logged_in', 'true');
        document.getElementById('userProfileBox').classList.remove('hidden');
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('userEmailLabel').innerText = Clerk.user.primaryEmailAddress.emailAddress;
      } else {
        localStorage.removeItem('user_logged_in');
        document.documentElement.className = 'not-logged-in scroll-smooth';
      }
    });
  </script>
</body>
</html>
